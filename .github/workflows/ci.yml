name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: optioncli
      - uses: actions/checkout@v4
        with:
          repository: fireflylabss/optionSDK
          path: optionSDK
          ref: v0.1.6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
        working-directory: optioncli
      - run: cargo test --all-targets
        working-directory: optioncli
      - run: cargo build --release
        working-directory: optioncli
