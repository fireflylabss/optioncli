[package]
name = "optioncli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "opt — the Option family CLI: dispatch, doctor, install and system utilities"
authors = ["AEFireflyLabs"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/fireflylabss/optioncli"
repository = "https://github.com/fireflylabss/optioncli"
documentation = "https://github.com/fireflylabss/optioncli#readme"
keywords = ["opt", "option", "cli", "local-first", "dispatch", "front-end"]
categories = ["command-line-utilities"]

[[bin]]
name = "opt"
path = "src/main.rs"

[dependencies]
optionSDK = "0.1.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
